<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Comparación de tiempos de degradación">
  <rect width="760" height="300" fill="#1B0E13"/>
  <text x="40" y="44" fill="#E6E8DD" font-family="Georgia, serif" font-size="21">Tiempo hasta la degradación</text>
  <text x="40" y="66" fill="#E6E8DD" opacity=".55" font-family="Courier New, monospace" font-size="11">ESCALA LOGARÍTMICA — CADA MARCA MULTIPLICA POR DIEZ</text>

  <line x1="40" y1="238" x2="720" y2="238" stroke="#3A2130" stroke-width="1"/>
  <g font-family="Courier New, monospace" font-size="10" fill="#E6E8DD" opacity=".45" text-anchor="middle">
    <text x="40" y="258">6 meses</text>
    <text x="210" y="258">5 años</text>
    <text x="380" y="258">50 años</text>
    <text x="550" y="258">500 años</text>
    <text x="710" y="258">5.000</text>
  </g>
  <g stroke="#3A2130" stroke-dasharray="2 5">
    <line x1="210" y1="96" x2="210" y2="238"/>
    <line x1="380" y1="96" x2="380" y2="238"/>
    <line x1="550" y1="96" x2="550" y2="238"/>
  </g>

  <rect x="40" y="106" width="30" height="30" fill="#E5A83B"/>
  <text x="82" y="120" fill="#E6E8DD" font-family="Helvetica, Arial, sans-serif" font-size="14">Fibra vegetal en compostaje industrial</text>
  <text x="82" y="137" fill="#E5A83B" font-family="Courier New, monospace" font-size="11">≥90% en 180 días — umbral EN 13432 / ASTM D6400</text>

  <rect x="40" y="170" width="590" height="30" fill="#8C1D33"/>
  <text x="82" y="184" fill="#E6E8DD" font-family="Helvetica, Arial, sans-serif" font-size="14">Toalla convencional con base de polietileno</text>
  <text x="82" y="201" fill="#E6E8DD" opacity=".7" font-family="Courier New, monospace" font-size="11">500 a 800 años estimados en relleno sanitario</text>
</svg>
