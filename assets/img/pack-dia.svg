<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-label="Empaque Aura DÍA">
  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E1728"/>
      <stop offset=".18" stop-color="#8C1D33"/>
      <stop offset=".62" stop-color="#8C1D33"/>
      <stop offset="1" stop-color="#6E1728"/>
    </linearGradient>
    <linearGradient id="s0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="h0" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E5A83B" stop-opacity=".30"/>
      <stop offset="1" stop-color="#E5A83B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- resplandor -->
  <ellipse cx="160" cy="200" rx="150" ry="170" fill="url(#h0)"/>

  <!-- sombra de apoyo -->
  <ellipse cx="160" cy="372" rx="96" ry="12" fill="#000" opacity=".35"/>

  <!-- cuerpo de la bolsa -->
  <path d="M62 54 h196 a6 6 0 0 1 6 6 v300 a6 6 0 0 1 -6 6 h-196 a6 6 0 0 1 -6 -6 v-300 a6 6 0 0 1 6 -6 z"
        fill="url(#g0)"/>

  <!-- sellado superior dentado -->
  <path d="M56 54 h208 v-16 h-208 z" fill="#6E1728"/>
  <path d="M56 38 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8
           l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 v-6 h-208 z" fill="#6E1728"/>

  <!-- sellado inferior -->
  <path d="M56 348 h208 v18 h-208 z" fill="#6E1728" opacity=".8"/>

  <!-- brillo -->
  <path d="M62 54 h196 v300 h-196 z" fill="url(#s0)"/>

  <!-- marca de agua: arco del aura -->
  <path d="M160 118 m-52 0 a52 52 0 1 1 104 0" fill="none" stroke="#E5A83B" stroke-width="2.5" opacity=".9"/>
  <circle cx="160" cy="118" r="7" fill="#E5A83B"/>

  <!-- logotipo -->
  <text x="160" y="176" text-anchor="middle" fill="#E5A83B"
        font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="6">aura</text>

  <!-- filete -->
  <rect x="104" y="192" width="112" height="1.5" fill="#E5A83B" opacity=".5"/>

  <!-- variante -->
  <text x="160" y="224" text-anchor="middle" fill="#E6E8DD"
        font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="5">DÍA</text>
  <text x="160" y="246" text-anchor="middle" fill="#E6E8DD" opacity=".65"
        font-family="Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="3.4">FLUJO MEDIO</text>

  <!-- ventana de composición -->
  <rect x="86" y="266" width="148" height="54" rx="2" fill="#000" opacity=".18"/>
  <text x="98" y="284" fill="#E6E8DD" opacity=".8"
        font-family="Courier New, monospace" font-size="8.5">BAMBU · CELULOSA FSC</text>
  <text x="98" y="298" fill="#E6E8DD" opacity=".8"
        font-family="Courier New, monospace" font-size="8.5">BASE DE ALMIDON DE MAIZ</text>
  <text x="98" y="312" fill="#E5A83B"
        font-family="Courier New, monospace" font-size="8.5">SIN CLORO · SIN PERFUME</text>

  <!-- conteo -->
  <circle cx="252" cy="86" r="21" fill="#E5A83B"/>
  <text x="252" y="92" text-anchor="middle" fill="#6E1728"
        font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">10</text>
  <text x="252" y="120" text-anchor="middle" fill="#E6E8DD" opacity=".7"
        font-family="Helvetica, Arial, sans-serif" font-size="7" letter-spacing="1.5">UNIDADES</text>

  <!-- marca de alas -->
  <g opacity=".55">
    <path d="M92 330 h18 M92 336 h12" stroke="#E6E8DD" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
